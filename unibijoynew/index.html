<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইউনিবিজয় - Unibijoy Bangla Typing</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Additional custom styles if needed */
        body {
            font-family: 'Inter', sans-serif; /* A nice modern font */
        }
        .toast {
            animation: slide-in 0.5s forwards, slide-out 0.5s 2.5s forwards;
        }
        @keyframes slide-in {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes slide-out {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-4xl bg-white p-6 md:p-8 rounded-2xl shadow-lg">
        <header class="text-center mb-6">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800">ইউনিবিজয় বাংলা টাইপিং টুল</h1>
            <p class="text-gray-500 mt-2">পুরানো নিয়মে সহজে বাংলা টাইপ করুন।</p>
        </header>

        <main>
            <!-- Textarea for typing -->
            <textarea id="banglaInput" class="w-full h-64 p-4 border-2 border-gray-200 rounded-lg text-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-300" placeholder="এখানে টাইপ করা শুরু করুন..."></textarea>

            <!-- Action Buttons -->
            <div class="flex flex-wrap items-center justify-center gap-4 mt-6">
                <button id="copyButton" class="px-6 py-3 bg-green-500 text-white font-semibold rounded-lg shadow-md hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-400 focus:ring-opacity-75 transition-transform transform hover:scale-105">
                    লেখা কপি করুন
                </button>
                <button id="clearTextButton" class="px-6 py-3 bg-red-500 text-white font-semibold rounded-lg shadow-md hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-400 focus:ring-opacity-75 transition-transform transform hover:scale-105">
                    সব মুছে ফেলুন
                </button>
                <button id="toggleLayoutButton" class="px-6 py-3 bg-blue-500 text-white font-semibold rounded-lg shadow-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-opacity-75 transition-transform transform hover:scale-105">
                    লেআউট দেখুন
                </button>
            </div>

            <!-- Keyboard Layout Image -->
            <div id="keyboardLayoutWrapper" class="mt-8 text-center hidden">
                <img id="keyboardLayout" src="https://i.ibb.co/6yv7z5Q/unibijoy-keyboard.png" alt="Unibijoy Keyboard Layout" class="max-w-full h-auto mx-auto border-4 border-gray-300 rounded-lg shadow-md">
                 <p class="text-xs text-gray-400 mt-2">Image courtesy: unibijoy.net</p>
            </div>
        </main>
    </div>
    
    <footer class="text-center mt-8 text-gray-500 text-sm">
        <p>আমিও আপনার মতো বাংলা কীবোর্ড বানাবার চেষ্টায়, আমি মূলত কাজ করছি বাংলা টাইপিং দক্ষতা বাড়ানোর একটি ওয়েব অ্যাপ। আমার সাথে যোগাযোগ করবেন +917584864899 এই নাম্বারে।</p>
    </footer>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed top-5 right-5 z-50"></div>

    <script>

                "Y": "ছ", "Yf": "ছা", "Yd": "ছি", "YD": "ছী", "Ys": "ছু", "YS": "ছূ", "Ya": "ছৃ", "Yc": "ছে", "YC": "ছৈ", "Yx": "ছো", "YX": "ছৌ",

                "T": "ঠ", "Tf": "ঠা", "Td": "ঠি", "TD": "ঠী", "Ts": "ঠু", "TS": "ঠূ", "Ta": "ঠৃ", "Tc": "ঠে", "TC": "ঠৈ", "Tx": "ঠো", "TX": "ঠৌ",
                "e": "ড", "ef": "ডা", "ed": "ডি", "eD": "ডী", "es": "ডু", "eS": "ডূ", "ea": "ডৃ", "ec": "ডে", "eC": "ডৈ", "ex": "ডো", "eX": "ডৌ",
                "E": "ঢ", "Ef": "ঢা", "Ed": "ঢি", "ED": "ঢী", "Es": "ঢু", "ES": "ঢূ", "Ea": "ঢৃ", "Ec": "ঢে", "EC": "ঢৈ", "Ex": "ঢো", "EX": "ঢৌ",
                "B": "ণ", "Bf": "ণা", "Bd": "ণি", "BD": "ণী", "Bs": "ণু", "BS": "ণূ", "Ba": "ণৃ", "Bc": "ণে", "BC": "ণৈ", "Bx": "ণো", "BX": "ণৌ",
                "k": "ত", "kf": "তা", "kd": "তি", "kD": "তী", "ks": "তু", "kS": "তূ", "ka": "তৃ", "kc": "তে", "kC": "তৈ", "kx": "তো", "kX": "তৌ",
                "K": "থ", "Kf": "থা", "Kd": "থি", "KD": "থী", "Ks": "থু", "KS": "থূ", "Ka": "থৃ", "Kc": "থে", "KC": "থৈ", "Kx": "খো", "KX": "থৌ",
                "l": "দ", "lf": "দা", "ld": "দি", "lD": "দী", "ls": "দু", "lS": "দূ", "la": "দৃ", "lc": "দে", "lC": "দৈ", "lx": "দো", "lX": "দৌ",
                "L": "ধ", "Lf": "ধা", "Ld": "ধি", "LD": "ধী", "Ls": "ধু", "LS": "ধূ", "La": "ধৃ", "Lc": "ধে", "LC": "ধৈ", "Lx": "ধো", "LX": "ধৌ",
                "b": "ন", "bf": "না", "bd": "নি", "bD": "নী", "bs": "নু", "bS": "নূ", "ba": "নৃ", "bc": "নে", "bC": "নৈ", "bx": "নো", "bX": "নৌ",
                "r": "প", "rf": "পা", "rd": "পি", "rD": "পী", "rs": "পু", "rS": "পূ", "ra": "পৃ", "rc": "পে", "rC": "পৈ", "rx": "পো", "rX": "পৌ",
                "R": "ফ", "Rf": "ফা", "Rd": "ফি", "RD": "ফী", "Rs": "ফু", "RS": "ফূ", "Ra": "ফৃ", "Rc": "ফে", "RC": "ফৈ", "Rx": "ফো", "RX": "ফৌ",
                "h": "ব", "hf": "বা", "hd": "বি", "hD": "বী", "hs": "বু", "hS": "বূ", "ha": "বৃ", "hc": "বে", "hC": "বৈ", "hx": "বো", "hX": "বৌ",
                "H": "ভ", "Hf": "ভা", "Hd": "ভি", "HD": "ভী", "Hs": "ভু", "HS": "ভূ", "Ha": "ভৃ", "Hc": "ভে", "HC": "ভৈ", "Hx": "ভো", "HX": "ভৌ",
                "m": "ম", "mf": "মা", "md": "মি", "mD": "মী", "ms": "মু", "mS": "মূ", "ma": "মৃ", "mc": "মে", "mC": "মৈ", "mx": "মো", "mX": "মৌ",
                "w": "য", "wf": "যা", "wd": "যি", "wD": "যী", "ws": "যু", "wS": "যূ", "wa": "যৃ", "wc": "যে", "wC": "যৈ", "wx": "যো", "wX": "যৌ",
                "W": "য়", "Wf": "য়া", "Wd": "য়ি", "WD": "য়ী", "Ws": "য়ু", "WS": "য়ূ", "Wa": "য়ৃ", "Wc": "য়ে", "WC": "য়ৈ", "Wx": "য়ো", "WX": "য়ৌ",
                "v": "র", "vf": "রা", "vd": "রি", "vD": "রী", "vs": "রু", "vS": "রূ", "va": "রৃ", "vc": "রে", "vC": "রৈ", "vx": "রো", "vX": "রৌ",
                "V": "ল", "Vf": "লা", "Vd": "লি", "VD": "লী", "Vs": "লু", "VS": "লূ", "Va": "লৃ", "Vc": "লে", "VC": "লৈ", "Vx": "লো", "VX": "লৌ",
                "M": "শ", "Mf": "শা", "Md": "শি", "MD": "শী", "Ms": "শু", "MS": "শূ", "Ma": "শৃ", "Mc": "শে", "MC": "শৈ", "Mx": "শো", "MX": "শৌ",
                "N": "ষ", "Nf": "ষা", "Nd": "ষি", "ND": "ষী", "Ns": "ষু", "NS": "ষূ", "Na": "ষৃ", "Nc": "ষে", "NC": "ষৈ", "Nx": "ষো", "NX": "ষৌ",
                "n": "স", "nf": "সা", "nd": "সি", "nD": "সী", "ns": "সু", "nS": "সূ", "na": "সৃ", "nc": "সে", "nC": "সৈ", "nx": "সো", "nX": "সৌ",
                "i": "হ", "if": "হা", "id": "হি", "iD": "হী", "is": "হু", "iS": "হূ", "ia": "হৃ", "ic": "হে", "iC": "হৈ", "ix": "হো", "iX": "হৌ",
                "p": "ড়", "P": "ঢ়", 

                // Conjuncts (যুক্তাক্ষর)
                "jgj": "ক্ক", "jgk": "ক্ত", "jgt": "ক্ট", "jgn": "ক্স", "jgN": "ক্ষ", "jgNgm": "ক্ষ্ম", "jgNZ": "ক্ষ্য", "jgV": "ক্ল", "jgh": "ক্ব",
                "Qgj": "ঙ্ক", "QgJ": "ঙ্খ", "Qgo": "ঙ্গ", "QgO": "ঙ্ঘ",
                "ygy": "চ্চ", "ygY": "চ্ছ", "Igu": "ঞ্জ", "IgY": "ঞ্ছ", "Igy": "ঞ্চ",
                "ugu": "জ্জ", "ugI": "জ্ঞ", "ugugh": "জ্জ্ব",
                "tgt": "ট্ট", "Bgt": "ণ্ট", "BgT": "ণ্ঠ", "Bge": "ণ্ড", "BgB": "ণ্ণ",
                "kgk": "ত্ত", "kgK": "ত্থ", "kgm": "ত্ম", "kgb": "ত্ন", "kgkgh": "ত্ত্ব",
                "lgl": "দ্দ", "lgL": "দ্ধ", "lgo": "দ্গ", "lgO": "দ্ঘ", "lgHz": "দ্ভ্র", "lglgh": "দ্দ্ব",
                "Lgh": "ধ্ব",
                "bgt": "ন্ট", "bgT": "ন্ঠ", "bge": "ন্ড",
                "bgk": "ন্ত", "bgK": "ন্থ", "bgl": "ন্দ", "bgL": "ন্ধ", "bgb": "ন্ন", "bgm": "ন্ম", "bgn": "ন্স",
                "rgr": "প্প", "rgV": "প্ল",
                "hgl": "ব্দ", "hgL": "ব্ধ", "hgu": "ব্জ", "hgh": "ব্ব",
                "mgm": "ম্ম", "mgh": "ম্ব", "mgH": "ম্ভ", "mgr": "ম্প", "mgR": "ম্ফ", "mgV": "ম্ল",
                "Mgy": "শ্চ", "Mgk": "শ্ত", "Mgb": "শ্ন", "Mgm": "শ্ম", "MgV": "শ্ল", "Mgh": "শ্ব",
                "Ngj": "ষ্ক", "Ngt": "ষ্ট", "NgT": "ষ্ঠ", "Ngm": "ষ্ম", "NgM": "ষ্ণ", "NgR": "ষ্ফ", "Ngtz": "ষ্ট্র", "Ngrz": "ষ্প্র",
                "ngj": "স্ক", "ngJ": "স্খ", "ngk": "স্ত", "ngK": "স্থ", "ngr": "স্প", "ngR": "স্ফ", "ngb": "স্ন", "ngm": "স্ম", "ngV": "স্ল", "ngh": "স্ব", "ngkz": "স্ত্র", "ngKZ": "স্থ্য",
                "igb": "হ্ন", "igB": "হ্ণ", "igm": "হ্ম", "igV": "হ্ল",
                "Ogb": "ঘ্ন", "Vgj": "ল্ক", "Vgo": "ল্গ", "Vgr": "ল্প", "VgV": "ল্ল",

                // Falas (ফলা)
                "z": "্র", "Z": "্য", "A": "র্",
                
                // Vowels (স্বরবর্ণ)
                "F": "অ", "FZ": "অ্যা", "gf": "আ", "gd": "ই", "gD": "ঈ", "gs": "উ", "gS": "ঊ", "ga": "ঋ", "gc": "এ", "gC": "ঐ", "gx": "ও", "gX": "ঔ",
                
                // Vowel signs (কার-চিহ্ন) - must be shorter than consonant combos
                "f": "া", "d": "ি", "D": "ী", "s": "ু", "S": "ূ", "a": "ৃ", "c": "ে", "C": "ৈ", "x": "ো", "X": "ৌ",
                
                // Other characters
                "g": "্",
                "q": "ং", "&": "ৎ", "^": "ঃ", "@": "ঁ",
                "G": "।", "gG": "॥",

                // Numbers
                "0": "০", "1": "১", "2": "২", "3": "৩", "4": "৪", "5": "৫", "6": "৬", "7": "৭", "8": "৮", "9": "৯",
            };

            const textBox = document.getElementById("banglaInput");
            const copyButton = document.getElementById("copyButton");
            const clearTextButton = document.getElementById("clearTextButton");
            const toggleLayoutButton = document.getElementById("toggleLayoutButton");
            const keyboardLayoutWrapper = document.getElementById("keyboardLayoutWrapper");

            // Sort keys by length, descending. This is crucial for correct matching.
            const sortedKeys = Object.keys(charMap).sort((a, b) => b.length - a.length);

            textBox.addEventListener("input", () => {
                const currentText = textBox.value;
                
                for (const key of sortedKeys) {
                    if (currentText.endsWith(key)) {
                        const textBefore = currentText.slice(0, -key.length);
                        const replacement = charMap[key];
                        
                        textBox.value = textBefore + replacement;
                        return; // Exit after the first (longest) match
                    }
                }
            });

            // --- Event Listeners for Buttons ---

            const showToast = (message, isError = false) => {
                const toastContainer = document.getElementById("toastContainer");
                const toast = document.createElement("div");
                toast.textContent = message;
                toast.className = `toast p-4 rounded-lg shadow-lg text-white font-bold ${isError ? 'bg-red-500' : 'bg-green-500'}`;
                toastContainer.appendChild(toast);
                setTimeout(() => {
                    toast.remove();
                }, 3000);
            };

            copyButton.addEventListener("click", () => {
                if (!textBox.value) {
                    showToast("কিছু লেখা নেই কপি করার জন্য!", true);
                    return;
                }
                // Using document.execCommand for better compatibility in snippets
                textBox.select();
                try {
                    document.execCommand('copy');
                    showToast("লেখা সফলভাবে কপি করা হয়েছে!");
                } catch (err) {
                    showToast("কপি করতে সমস্যা হচ্ছে!", true);
                }
                 // Deselect the text
                window.getSelection().removeAllRanges();
            });

            clearTextButton.addEventListener("click", () => {
                textBox.value = "";
                showToast("সমস্ত লেখা মুছে ফেলা হয়েছে।");
            });

            toggleLayoutButton.addEventListener("click", () => {
                const isHidden = keyboardLayoutWrapper.classList.toggle("hidden");
                toggleLayoutButton.textContent = isHidden ? "লেআউট দেখুন" : "লেআউট লুকান";
            });
        });
    </script>
</body>
</html>
